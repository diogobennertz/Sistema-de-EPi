<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>EPI Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#18212f;--mu:#667085;--bd:#e3e7ee;--nav:#0f2342;--pr:#1d5fd1;--ok:#14804a;--wa:#c77700;--er:#c92a2a;--okb:#e3f6ea;--wab:#fff1d6;--erb:#fde6e6;--prb:#e6efff;box-sizing:border-box}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e131b;--card:#161d29;--tx:#e8ecf3;--mu:#97a1b3;--bd:#273041;--nav:#0a1730;--pr:#5b95f0;--ok:#4cc790;--wa:#f2b04a;--er:#f07878;--okb:#12352a;--wab:#3b2c10;--erb:#3d1b1b;--prb:#17294a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e131b;--card:#161d29;--tx:#e8ecf3;--mu:#97a1b3;--bd:#273041;--nav:#0a1730;--pr:#5b95f0;--ok:#4cc790;--wa:#f2b04a;--er:#f07878;--okb:#12352a;--wab:#3b2c10;--erb:#3d1b1b;--prb:#17294a}}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}.side{width:240px;background:var(--nav);color:#cfd8e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.side h1{color:#fff;margin:0;padding:20px;font-size:20px}.side h1 span{color:#f5b638}
.side nav{flex:1;overflow:auto}.side a{display:block;padding:10px 20px;color:inherit;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
.side a:hover{background:#ffffff14}.side a.on{background:#ffffff1f;color:#fff;border-color:#f5b638}
.me{padding:14px 20px;border-top:1px solid #ffffff22;font-size:12px}.me b{display:block;color:#fff;font-size:13px}
.main{flex:1;min-width:0}.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top h2{margin:0;font-size:18px}.crumb{font-size:12px;color:var(--mu)}.top .sp{flex:1}
.page{padding:24px;max-width:1300px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;box-shadow:0 1px 2px #0001}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{font-size:26px;display:block;margin-top:4px}.kpi span{color:var(--mu);font-size:12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}.btn:hover{filter:brightness(.9)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er)}.btn.x{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.bar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}.bar input,.bar select{width:auto;min-width:150px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);cursor:pointer;user-select:none}tr:hover td{background:var(--bg)}
.bd{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;display:inline-block}.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}.in{background:var(--prb);color:var(--pr)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:12px;padding:20px;width:620px;max-width:100%;max-height:92vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{font-size:12px;color:var(--mu);display:block}.fg .w{grid-column:1/-1}.err{color:var(--er);font-size:12px;min-height:14px}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:grid;gap:8px}#toast div{background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px}#toast .e{background:var(--er)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--nav);padding:16px}.login .card{width:380px;max-width:100%}
.demo{background:var(--wab);color:var(--wa);padding:8px 12px;border-radius:8px;font-size:12px;margin:10px 0}
.pg{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;text-align:center;font-size:11px}.bars i{display:block;background:var(--pr);border-radius:4px 4px 0 0;margin-bottom:4px}
.hb{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.hb i{display:block;height:10px;background:var(--pr);border-radius:5px}
.ai{white-space:pre-wrap;line-height:1.5}.der{overflow:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);height:520px}
.mb{display:none}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.lk{color:var(--pr);cursor:pointer;font-size:12px;font-weight:500}.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}.av,.ic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}.av{border-radius:50%;background:var(--prb);color:var(--pr)}.ic{border-radius:10px;font-size:16px}.lt{flex:1;min-width:0}.lt b,.lt small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--mu);font-size:12px}.lr{text-align:right;display:grid;gap:3px;justify-items:end;flex:none}.qt{font-weight:700}
@media(max-width:860px){.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:40}.side h1,.me{display:none}.side nav{display:flex;overflow-x:auto}.side a{white-space:nowrap;padding:12px 14px;border-left:0;border-top:3px solid transparent}.app{flex-direction:column;padding-bottom:50px}.page{padding:14px}.fg{grid-template-columns:1fr}.mb{display:block}}
@media print{.side,.top,.noprint{display:none}}
</style></head><body>
<div id="root"></div><div id="toast"></div>
<script>
/* ===== Camada de dados: API REST (Spring Boot + MySQL) ===== */
const K='epi_control_v1',T0=new Date();T0.setHours(12,0,0,0);
const dOff=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
let D={col:[],ep:[],us:[],en:[],mv:[]},AUTH=null,ME=null;
try{AUTH=sessionStorage.getItem('epi_auth')}catch(e){}
const PERF={ADMIN:'Administrador',GESTOR:'Gestor de EPIs',CONSULTA:'Consulta'},PERF_R=Object.fromEntries(Object.entries(PERF).map(([k,v])=>[v,k]));
const MVT={ENTRADA:'Entrada',ENTREGA:'Entrega',DEVOLUCAO:'Devolução',AJUSTE:'Ajuste'};
function logout(){AUTH=null;ME=null;user=null;try{sessionStorage.removeItem('epi_auth')}catch(e){};shell()}
async function api(method,url,body){
 const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(AUTH?{Authorization:'Basic '+AUTH}:{})},body:body===undefined?undefined:JSON.stringify(body)});
 if(r.status==401){logout();throw new Error('Sessão expirada. Entre novamente.')}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){let m;if(r.status==403)m='Sem permissão para esta ação.';else if(j&&j.erro)m=j.erro;else m='Erro '+r.status+' no servidor.';throw new Error(m)}
 return j}
const run=async f=>{try{await f()}catch(e){toast(e.message,1)}};
const stt=a=>a?'Ativo':'Inativo';
async function loadAll(){
 const [c,e,u,en,mv]=await Promise.all(['colaboradores','epis','usuarios','entregas','movimentacoes'].map(x=>api('GET','/api/'+x)));
 D={col:c.map(x=>({id:x.id,nome:x.nome,cpf:x.cpf,mat:x.matricula,cargo:x.cargo||'',setor:x.setor||'',tel:x.telefone||'',adm:x.dataAdmissao||'',status:stt(x.ativo)})),
 ep:e.map(x=>({id:x.id,cod:x.codigo,nome:x.nome,cat:x.categoria,fab:x.fabricante,ca:x.numeroCa,vca:x.validadeCa||'',val:x.validadeFisica||'',min:x.estoqueMinimo,est:x.quantidadeEstoque,reut:x.reutilizavel,desc:x.descricao||'',status:stt(x.ativo)})),
 us:u.map(x=>({id:x.id,nome:x.nome,email:x.email,perfil:PERF[x.perfil]||x.perfil,status:stt(x.ativo),cad:x.dataCadastro||''})),
 en:en.map(x=>({id:x.id,col:x.colaborador.id,usr:x.usuario.id,dt:x.dataEntrega,prev:x.dataPrevistaDevolucao||'',obs:x.observacao||'',it:x.itens.map(t=>({id:t.id,epi:t.epi.id,q:t.quantidade,dev:t.quantidadeDevolvida,cond:t.condicao||''}))})),
 mv:mv.map(x=>({dt:x.dataHora,tipo:MVT[x.tipo]||x.tipo,epi:x.epi.id,q:x.quantidade,col:x.colaborador?x.colaborador.id:0,usr:x.usuario.id,ref:x.referencia||'—',obs:x.observacao||''}))}}
const by=(a,id)=>a.find(x=>x.id==id)||{};
/* ===== utilitários ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>s?s.slice(0,10).split('-').reverse().join('/'):'—',fdt=s=>fd(s)+' '+(s.slice(11,16)||''),nf=n=>Number(n).toLocaleString('pt-BR');
const today=dOff(0),bd=(t,c)=>`<span class="bd ${c}">${t}</span>`;
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
function mov(tipo,epi,q,col,usr,ref,obs){D.mv.push({dt:new Date().toISOString().slice(0,16),tipo,epi,q,col,usr,ref,obs:obs||''})}
const pend=t=>by(D.ep,t.epi).reut?t.q-t.dev:0;
function eSt(e){const t=D.en.find(x=>x===e);const its=e.it,p=its.reduce((a,t)=>a+pend(t),0);
 if(!p)return its.some(t=>t.cond&&t.cond!='Bom')&&its.every(t=>pend(t)==0&&t.cond=='Descartado')?'Descartado':its.some(t=>t.cond=='Danificado')?'Danificado':its.some(t=>by(D.ep,t.epi).reut)?'Devolvido':'Entregue';
 if(e.prev&&e.prev<today)return'Atrasado';return its.some(t=>t.dev)?'Devolução parcial':'Em uso'}
const sc={'Em uso':'in','Entregue':'ok','Devolvido':'ok','Devolução parcial':'wa','Atrasado':'er','Danificado':'er','Descartado':'er',Ativo:'ok',Inativo:'er'};
const sb=s=>bd(s,sc[s]||'in');
function vst(e){if(e.val&&e.val<today)return['Vencido','er'];if(e.val&&e.val<dOff(60))return['Vence em breve','wa'];if(e.vca<today)return['CA vencido','er'];return null}
function stk(e){return e.est<=0?['Indisponível','er']:e.est<e.min?['Baixo','wa']:['Normal','ok']}
function ask(msg,fn){modal(`<h3>Confirmação</h3><p>${msg}</p><div class="bar"><button class="btn d" id="yes">Confirmar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`);$('#yes').onclick=()=>{closeM();fn()}}
function modal(h){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="md" role="dialog">'+h+'</div>';o.onmousedown=e=>{if(e.target==o)closeM()};document.body.append(o)}
const closeM=()=>$('#ov')?.remove();
/* formulário genérico: f=[nome,rótulo,tipo,opções,obrigatório] */
function form(title,f,v,onok){
 modal(`<h3>${title}</h3><div class="fg">${f.map(([n,l,t,o,r])=>`<div class="${t=='area'?'w':''}"><label for="f_${n}">${l}${r?' *':''}</label>${t=='sel'?`<select id="f_${n}">${o.map(x=>`<option ${x==v[n]?'selected':''}>${x}</option>`).join('')}</select>`:t=='area'?`<textarea id="f_${n}" rows="2">${esc(v[n])}</textarea>`:`<input id="f_${n}" type="${t||'text'}" value="${esc(v[n])}">`}</div>`).join('')}</div><div class="err" id="fe"></div><div class="bar"><button class="btn" id="ok">Salvar</button><button class="btn s" onclick="closeM()">Cancelar</button></div>`);
 $('#ok').onclick=()=>{const r={};for(const [n,l,t,o,req] of f){let x=$('#f_'+n).value.trim();if(req&&!x)return $('#fe').textContent=`Preencha o campo obrigatório: ${l}.`;if(t=='number'){x=Number(x);if(x<0||isNaN(x))return $('#fe').textContent=`Valor inválido em ${l}.`}r[n]=x}
  const m=onok(r);if(m&&m.then){$('#ok').disabled=true;m.then(x=>{if(x){$('#fe').textContent=x;$('#ok').disabled=false}else closeM()},e=>{$('#fe').textContent=e.message;$('#ok').disabled=false})}else if(m)$('#fe').textContent=m;else closeM()}}
/* ===== lista genérica com busca, filtro, ordenação e paginação ===== */
const S={};let LC={};
function list(k,rows,cols,o={}){LC[k]={rows,cols,o};S[k]=S[k]||{q:'',f:{},p:0,s:-1,d:1};const s=S[k];
 return`<div class="bar noprint"><input placeholder="Pesquisar…" aria-label="Pesquisar" value="${esc(s.q)}" oninput="S['${k}'].q=this.value;S['${k}'].p=0;draw('${k}')">${(o.filters||[]).map(([n,opts])=>`<select aria-label="${n}" onchange="S['${k}'].f['${n}']=this.value;S['${k}'].p=0;draw('${k}')"><option value="">${n}: todos</option>${opts.map(x=>`<option ${s.f[n]==x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}</div><div class="card tw" id="L_${k}">${tbl(k)}</div>`}
function tbl(k){const{rows,cols,o}=LC[k],s=S[k];let r=rows.filter(x=>(!s.q||JSON.stringify(Object.values(x)).toLowerCase().includes(s.q.toLowerCase()))&&Object.entries(s.f).every(([n,v])=>!v||o.fv[n](x)==v));
 if(s.s>=0){const g=cols[s.s][1];r=[...r].sort((a,b)=>String(g(a,1)).localeCompare(String(g(b,1)),'pt',{numeric:true})*s.d)}
 const n=Math.ceil(r.length/8)||1;s.p=Math.min(s.p,n-1);
 return r.length?`<table><thead><tr>${cols.map((c,i)=>`<th onclick="S['${k}'].s=${i};S['${k}'].d*=-1;draw('${k}')">${c[0]}${s.s==i?(s.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${r.slice(s.p*8,s.p*8+8).map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="pg"><button class="btn s x" ${s.p?'':'disabled'} onclick="S['${k}'].p--;draw('${k}')">‹</button>Página ${s.p+1} de ${n} · ${r.length} registros<button class="btn s x" ${s.p<n-1?'':'disabled'} onclick="S['${k}'].p++;draw('${k}')">›</button></div>`:'<p style="padding:20px;text-align:center;color:var(--mu)">Nenhum registro encontrado.</p>'}
const draw=k=>{$('#L_'+k).innerHTML=tbl(k)};
const rawv=(f)=>(x,s)=>f(x);
/* ===== páginas ===== */
const nm=(a,id)=>esc(by(a,id).nome||'—');
const PAGES={painel:['Painel','',()=>{
 const m=today.slice(0,7),ents=D.en,ativos=D.col.filter(c=>c.status=='Ativo').length,tot=D.ep.reduce((a,e)=>a+e.est,0);
 const venc=D.ep.filter(e=>vst(e)),baixo=D.ep.filter(e=>stk(e)[0]!='Normal'),pnd=D.en.filter(e=>['Atrasado','Em uso','Devolução parcial'].includes(eSt(e))&&e.it.some(t=>pend(t))),atr=pnd.filter(e=>eSt(e)=='Atrasado');
 const ms=[...Array(6)].map((_,i)=>{const d=new Date(T0);d.setMonth(d.getMonth()-5+i,1);return d.toISOString().slice(0,7)}),mc=ms.map(x=>ents.filter(e=>e.dt.slice(0,7)==x).length),mx=Math.max(...mc,1);
 const cats={};D.ep.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+1);
 return`<div class="demo">Dados fictícios e demonstrativos, salvos apenas neste navegador.</div><div class="bar"><button class="btn" onclick="go('colaboradores');colForm()">+ Colaborador</button><button class="btn" onclick="go('epis');epiForm()">+ EPI</button><button class="btn" onclick="entForm()">+ Registrar entrega</button></div>
 <div class="grid g3">${[['Colaboradores ativos',ativos],['Tipos de EPI',D.ep.length],['Disponível em estoque',nf(tot)],['Entregas no mês',ents.filter(e=>e.dt.slice(0,7)==m).length],['Vencidos / a vencer',venc.length],['Devoluções pendentes',pnd.length+' ('+atr.length+' atrasadas)']].map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div><br>
 <div class="grid g2"><div class="card"><b>Entregas nos últimos 6 meses</b><br><br><div class="bars">${mc.map((c,i)=>`<div><i style="height:${c/mx*110}px"></i>${c}<br>${ms[i].slice(5)}/${ms[i].slice(2,4)}</div>`).join('')}</div></div>
 <div class="card"><b>EPIs por categoria</b>${Object.entries(cats).map(([c,n])=>`<div class="hb"><span>${c}</span><i style="width:${n*40}px"></i><span>${n}</span></div>`).join('')}</div>
 <div class="card"><b>Alertas de estoque baixo</b>${baixo.map(e=>`<p>${esc(e.nome)} ${bd(stk(e)[0],stk(e)[1])} <small>${e.est}/${e.min}</small></p>`).join('')||'<p>Sem alertas.</p>'}</div>
 <div class="card"><b>Vencidos ou próximos do vencimento</b>${venc.map(e=>`<p>${esc(e.nome)} ${bd(vst(e)[0],vst(e)[1])}</p>`).join('')||'<p>Sem alertas.</p>'}</div>
 <div class="card"><div class="ch"><b>Entregas recentes</b><a class="lk" onclick="go('entregas')">Ver todas →</a></div>${[...ents].reverse().slice(0,5).map(e=>{const c=by(D.col,e.col);return`<div class="li"><span class="av">${esc((c.nome||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div class="lt"><b>${esc(c.nome)}</b><small>${e.it.map(t=>esc(by(D.ep,t.epi).nome)+' ×'+t.q).join(' · ')}</small></div><div class="lr">${sb(eSt(e))}<small>${fd(e.dt)}</small></div></div>`}).join('')}</div>
 <div class="card"><div class="ch"><b>Últimas movimentações</b><a class="lk" onclick="go('historico')">Ver histórico →</a></div>${[...D.mv].sort((a,b)=>b.dt.localeCompare(a.dt)).slice(0,6).map(m=>{const I={Entrada:['↓','ok'],Entrega:['→','in'],Devolução:['↩','ok'],Ajuste:['⚙','wa']}[m.tipo]||['•','in'],neg=m.tipo=='Entrega'||(m.tipo=='Ajuste'&&m.q<0);return`<div class="li"><span class="ic ${I[1]}">${I[0]}</span><div class="lt"><b>${m.tipo} · ${nm(D.ep,m.epi)}</b><small>${m.col?nm(D.col,m.col)+' · ':''}por ${nm(D.us,m.usr)}${m.ref&&m.ref!='—'?' · '+m.ref:''}</small></div><div class="lr"><span class="qt" style="color:var(--${neg?'er':'ok'})">${neg?'−':'+'}${Math.abs(m.q)}</span><small>${fdt(m.dt)}</small></div></div>`}).join('')}</div></div>`}],
colaboradores:['Colaboradores','Cadastros',()=>`<div class="bar"><button class="btn" onclick="colForm()">+ Novo colaborador</button></div>`+list('col',D.col,[['Nome',x=>esc(x.nome)],['CPF',x=>x.cpf],['Matrícula',x=>x.mat],['Cargo',x=>esc(x.cargo)],['Setor',x=>x.setor],['Admissão',x=>fd(x.adm)],['Telefone',x=>x.tel],['Situação',x=>sb(x.status)],['Ações',x=>`<button class="btn s x" onclick="colDet(${x.id})">Ver</button> <button class="btn s x" onclick="colForm(${x.id})">Editar</button> ${x.status=='Ativo'?`<button class="btn d x" onclick="colOff(${x.id})">Inativar</button>`:''}`]],{filters:[['setor',[...new Set(D.col.map(c=>c.setor))]],['status',['Ativo','Inativo']]],fv:{setor:x=>x.setor,status:x=>x.status}})],

'Estoque atual':()=>[['EPI','Categoria','Disponível','Mínimo','Situação'],D.ep.filter(e=>!rg()||e.cat==rg()).map(e=>[e.nome,e.cat,e.est,e.min,stk(e)[0]])],
'Abaixo do mínimo':()=>[['EPI','Disponível','Mínimo'],D.ep.filter(e=>e.est<e.min&&(!rg()||e.cat==rg())).map(e=>[e.nome,e.est,e.min])],
'Movimentações por usuário':()=>[['Usuário','Tipo','Qtd. movimentos','Total unidades'],Object.values(D.mv.filter(m=>inP(m.dt.slice(0,10))).reduce((a,m)=>{const k=m.usr+m.tipo;(a[k]=a[k]||[by(D.us,m.usr).nome,m.tipo,0,0]);a[k][2]++;a[k][3]+=Math.abs(m.q);return a},{}))],
'Vencidos ou a vencer':()=>[['EPI','Validade','Validade do CA','Situação'],D.ep.filter(e=>vst(e)&&(!rg()||e.cat==rg())).map(e=>[e.nome,fd(e.val),fd(e.vca),vst(e)[0]])]};
let cur;function rep(){cur=RP[$('#rt').value]();$('#rep').innerHTML=`<table><tr>${cur[0].map(h=>`<th>${h}`).join('')}</tr>${cur[1].map(r=>`<tr>${r.map(c=>`<td>${esc(c)}`).join('')}</tr>`).join('')}</table><p><b>Total de registros: ${cur[1].length}</b></p>`}
function csv(){const t=[cur[0],...cur[1]].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');const b=new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='relatorio-epi-control.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV gerado')}
/* ===== DER ===== */
let zm=1;
const box=(x,y,n,a,w=210)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${26+a.length*17}" rx="6" fill="var(--card)" stroke="var(--pr)" stroke-width="1.5"/><rect x="${x}" y="${y}" width="${w}" height="26" rx="6" fill="var(--pr)"/><text x="${x+w/2}" y="${y+18}" fill="#fff" text-anchor="middle" font-weight="700" font-size="13">${n}</text>${a.map((t,i)=>`<text x="${x+8}" y="${y+43+i*17}" font-size="11.5" fill="var(--tx)">${t.includes('(PK)')?`<tspan font-weight="700">${t}</tspan>`:t}</text>`).join('')}</g>`;
const ln=(x1,y1,x2,y2,a,b,lx1,ly1,lx2,ly2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--mu)" stroke-width="1.5"/><text x="${lx1}" y="${ly1}" font-weight="700" fill="var(--wa)" font-size="14">${a}</text><text x="${lx2}" y="${ly2}" font-weight="700" fill="var(--wa)" font-size="14">${b}</text>`;
function derSvg(){return`<svg viewBox="0 0 1000 660" width="${1000*zm}" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,sans-serif">
${box(20,20,'COLABORADOR',['id_colaborador (PK)','nome_completo','cpf','matricula','cargo','setor','telefone','data_admissao','status'])}
${box(770,20,'USUARIO',['id_usuario (PK)','nome','email','perfil','status','data_cadastro'])}
${box(385,170,'ENTREGA',['id_entrega (PK)','data_entrega','data_prevista_devolucao','status','observacoes','id_colaborador (FK)','id_usuario (FK)'],230)}
${box(385,420,'ITEM_ENTREGA',['id_item_entrega (PK)','id_entrega (FK)','id_epi (FK)','quantidade','quantidade_devolvida','condicao','observacoes'],230)}
${box(770,350,'EPI',['id_epi (PK)','codigo','nome','categoria','fabricante','numero_ca','quantidade_estoque','estoque_minimo','validade_ca','data_validade','descricao','status'])}
${ln(230,120,385,220,'1','N',236,115,360,212)}${ln(770,80,615,220,'1','N',744,76,622,212)}${ln(500,333,500,420,'1','N',506,352,506,412)}${ln(770,480,615,500,'1','N',745,474,622,494)}
<text x="395" y="395" font-size="11" fill="var(--mu)">realiza / contém</text><text x="640" y="530" font-size="11" fill="var(--mu)">é referenciado em</text><text x="160" y="170" font-size="11" fill="var(--mu)">recebe</text><text x="680" y="160" font-size="11" fill="var(--mu)">registra</text></svg>`}
function zmv(d){zm=Math.min(2,Math.max(.5,zm+d));$('#dsv').innerHTML=derSvg()}
function derPage(){return`<div class="bar noprint"><button class="btn s" onclick="go('painel')">← Painel</button><button class="btn s" onclick="zmv(-.2)">−</button><button class="btn s" onclick="zmv(.2)">+</button><button class="btn s" onclick="window.print()">Imprimir</button></div><div class="der" id="dsv">${derSvg()}</div><p class="crumb">Role o quadro para mover; use + e − para zoom. Legenda: <b>PK</b> chave primária · <b>FK</b> chave estrangeira (referência complementar) · <b>1:N</b> um para muitos.</p>
<div class="grid g2"><div class="card"><b>Entidades</b><p><b>COLABORADOR</b>: quem recebe EPIs.<br><b>EPI</b>: catálogo de equipamentos e estoque.<br><b>USUARIO</b>: responsável pelo registro.<br><b>ENTREGA</b>: operação de entrega a um colaborador.<br><b>ITEM_ENTREGA</b>: cada EPI e quantidade dentro de uma entrega.</p></div>
<div class="card"><b>Relacionamentos</b><p>COLABORADOR 1:N ENTREGA · USUARIO 1:N ENTREGA · ENTREGA 1:N ITEM_ENTREGA · EPI 1:N ITEM_ENTREGA.</p><b>Entidade associativa</b><p>A relação N:N entre ENTREGA e EPI é resolvida por ITEM_ENTREGA, que guarda quantidade, devolvida e condição de cada item.</p></div>
<div class="card"><b>Regras de negócio</b><p>Sem entrega a colaborador inativo · quantidade ≤ estoque · devolução referencia o item original e não excede o pendente · CPF, matrícula, código e e-mail únicos · inativar em vez de excluir.</p></div></div>`}
/* ===== IA: recomendação de EPIs ===== */
async function recom(){const q=$('#aiq').value.trim(),o=$('#aio');if(q.length<10)return toast('Descreva a atividade ou o risco com mais detalhes.',1);
 let sm=null;try{sm=await claude.use('sample')}catch(e){}if(!sm){o.textContent='Recurso de IA indisponível neste ambiente. Abra o link publicado pelo claude.ai para habilitar.';return}
 const cat=D.ep.filter(e=>e.status=='Ativo').map(e=>({id:e.id,nome:e.nome,categoria:e.cat,ca:e.ca,disponivel:e.est,ca_vencido:e.vca<today}));
 $('#aib').disabled=true;o.textContent='Analisando…';
 try{const r=await sm(`Você é um assistente de segurança do trabalho (construção civil, normas NR brasileiras). Atividade/risco descritos: """${q}"""\nCatálogo disponível (JSON): ${JSON.stringify(cat)}\nRecomende APENAS EPIs do catálogo, citando o nome exato. Para cada um: justificativa objetiva ligada ao risco, e alerta se disponivel<=0 ou ca_vencido. Liste riscos identificados primeiro. Se faltar um EPI necessário no catálogo, diga em "Lacunas do catálogo". Termine lembrando que a decisão final é do profissional de segurança. Responda em português, texto simples sem markdown pesado.`,{cache:false,onText:({text})=>{o.textContent=text}});o.textContent=r.text}
 catch(e){o.textContent='Não foi possível obter a recomendação ('+(e.code||'erro')+').'}
 $('#aib').disabled=false}
/* ===== shell, navegação e login ===== */
const NAV=[['painel','▦'],['colaboradores','☺'],['epis','⛑'],['estoque','▤'],['entregas','⇄'],['historico','⟲'],['usuarios','⚇'],['relatorios','▥'],['der','◫'],['config','⚙']];
let user=null;
function go(p){location.hash=p;shell()}
function shell(){if(!user)return loginUI();const p=(location.hash.slice(1)||'painel'),pg=PAGES[p]||PAGES.painel;const act=NAV.find(n=>n[0]==p)?p:'painel';
 $('#root').innerHTML=`<div class="app"><aside class="side"><h1>EPI <span>Control</span></h1><nav>${NAV.map(([k,i])=>`<a class="${k==act?'on':''}" onclick="go('${k}')">${i} ${PAGES[k][0]}</a>`).join('')}</nav><div class="me"><b>${esc(user)}</b>${esc(ME?PERF[ME.perfil]:'')}<br><a style="padding:6px 0" onclick="logout()">Sair</a></div></aside><div class="main"><header class="top"><div><h2>${pg[0]}</h2><div class="crumb">EPI Control › ${pg[1]?pg[1]+' › ':''}${pg[0]}</div></div><div class="sp"></div><input id="gs" placeholder="Pesquisa global…" aria-label="Pesquisa global" style="max-width:220px" onkeydown="if(event.key=='Enter')gsearch(this.value)"><button class="btn s" onclick="toggleTheme()" aria-label="Alternar modo claro/escuro" title="Alternar modo claro/escuro">◐</button><button class="btn s" onclick="notif()" aria-label="Notificações">🔔 ${D.ep.filter(e=>stk(e)[0]!='Normal'||vst(e)).length}</button><button class="btn s mb" onclick="logout()">Sair</button></header><main class="page">${pg[2]()}</main></div></div>`;if(p=='relatorios')rep()}
function gsearch(v){v=v.toLowerCase();if(!v)return;const c=D.col.find(x=>(x.nome+x.cpf+x.mat).toLowerCase().includes(v));const e=D.ep.find(x=>(x.nome+x.cod+x.ca).toLowerCase().includes(v));if(c)go('colaboradores'),colDet(c.id);else if(e)go('epis'),epiDet(e.id);else toast('Nada encontrado.',1)}
function notif(){modal(`<h3>Notificações</h3>${D.ep.filter(e=>stk(e)[0]!='Normal').map(e=>`<p>${bd('Estoque','wa')} ${esc(e.nome)}: ${e.est} (mín. ${e.min})</p>`).join('')}${D.ep.filter(vst).map(e=>`<p>${bd(vst(e)[0],vst(e)[1])} ${esc(e.nome)}</p>`).join('')}<button class="btn s" onclick="closeM()">Fechar</button>`)}
function loginUI(){$('#root').innerHTML=`<div class="login"><div class="card"><h1 style="margin:0">EPI <span style="color:var(--wa)">Control</span></h1><p class="crumb">Gestão de Equipamentos de Proteção Individual</p><label class="crumb" for="lm">E-mail</label><input id="lm" type="email" value=""><br><br><label class="crumb" for="lp">Senha</label><div class="bar" style="margin:0;flex-wrap:nowrap"><input id="lp" type="password" value=""><button class="btn s" type="button" onclick="lp.type=lp.type=='password'?'text':'password'">Mostrar</button></div><div class="err" id="le"></div><button class="btn" style="width:100%" onclick="doLogin()">Entrar</button><p><a href="#" onclick="event.preventDefault();toast('Peça a redefinição da senha a um administrador.')">Esqueci minha senha</a></p></div></div>`}
async function doLogin(){const m=$('#lm').value.trim(),p=$('#lp').value;if(!/^\S+@\S+\.\S+$/.test(m))return $('#le').textContent='Informe um e-mail válido.';if(!p)return $('#le').textContent='Informe a senha.';
 const a=btoa(unescape(encodeURIComponent(m+':'+p)));
 try{const r=await fetch('/api/auth/me',{headers:{Authorization:'Basic '+a}});if(r.status==401)return $('#le').textContent='E-mail ou senha inválidos, ou usuário inativo.';if(!r.ok)throw 0;
 ME=await r.json();AUTH=a;try{sessionStorage.setItem('epi_auth',a)}catch(e){}user=ME.nome;await loadAll();location.hash='painel';shell()}catch(e){$('#le').textContent='Não foi possível conectar ao servidor.'}}
const th=()=>{try{return localStorage.getItem('epi_theme')||'auto'}catch(e){return'auto'}};
function applyTheme(){const t=th();if(t=='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
function setTheme(t){try{localStorage.setItem('epi_theme',t)}catch(e){}applyTheme();shell()}
function toggleTheme(){const dk=th()=='dark'||(th()=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);setTheme(dk?'light':'dark')}
applyTheme();window.onhashchange=shell;
(async()=>{if(AUTH){try{ME=await api('GET','/api/auth/me');user=ME.nome;await loadAll()}catch(e){AUTH=null;ME=null;user=null}}shell()})();
</script></body></html>
